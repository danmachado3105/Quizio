<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partida | Quizio</title>
  <meta name="description" content="Responda às perguntas, acumule pontos e suba de nível no Quizio.">
  <meta name="theme-color" content="#7254D8">

  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/jogo.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>

<body data-pagina="jogo" data-base="../">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="cabecalho" id="cabecalho"></header>

  <main class="container jogo-pagina" id="conteudo">

    <!-- Partida em andamento (preenchida por jogo.js) -->
    <section class="jogo" id="jogo" aria-label="Partida em andamento" hidden>

      <div class="jogo__topo">
        <div class="jogo__acoes">
          <button class="botao botao--texto" type="button" id="botao-sair" data-icone="x" data-tamanho-icone="18">Sair</button>
          <button class="botao botao--texto" type="button" id="botao-pausar" data-icone="pause" data-tamanho-icone="18">Pausar</button>
        </div>

        <div class="jogo__status" id="jogo-status">
          <div class="indicador indicador--pontos" id="chip-pontos">
            <span data-icone="star" data-tamanho-icone="18" aria-hidden="true"></span>
            <span class="indicador__valor" id="pontos-valor">0</span>
            <span class="indicador__unidade">pts</span>
          </div>

          <div class="indicador indicador--combo" id="chip-combo" data-ativo="false">
            <span data-icone="flame" data-tamanho-icone="18" aria-hidden="true"></span>
            <span class="indicador__valor" id="combo-valor">Combo ×0</span>
            <span class="combo__pips" aria-hidden="true">
              <span class="combo__pip"></span>
              <span class="combo__pip"></span>
              <span class="combo__pip"></span>
            </span>
          </div>
        </div>
      </div>

      <div class="progresso">
        <p class="progresso__contador rotulo" id="contador-pergunta"></p>
        <div class="segmentos" id="segmentos" role="progressbar" aria-label="Progresso da partida" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"></div>
      </div>

      <!-- Reservado para a barra de tempo do modo "Contra o tempo" -->
      <div class="jogo__tempo" id="slot-tempo" hidden></div>

      <div class="palco">
        <article class="carta-pergunta" id="carta-pergunta" aria-labelledby="pergunta-enunciado">
          <div class="carta-pergunta__marcas" id="pergunta-marcas"></div>
          <h1 class="pergunta__enunciado" id="pergunta-enunciado" tabindex="-1"></h1>
          <div class="alternativas" id="alternativas" role="group" aria-labelledby="pergunta-enunciado"></div>
          <div class="feedback-area" id="feedback" aria-live="polite"></div>
        </article>

        <section class="pausa fundo-escuro" id="tela-pausa" aria-labelledby="pausa-titulo" hidden>
          <span class="pausa__icone" data-icone="pause" data-tamanho-icone="32" aria-hidden="true"></span>
          <h2 class="pausa__titulo" id="pausa-titulo" tabindex="-1">Partida pausada</h2>
          <p class="pausa__texto">O tempo parado não conta na sua partida. A pergunta fica escondida até você voltar.</p>
          <div class="pausa__acoes">
            <button class="botao botao--amarelo botao--grande" type="button" id="botao-continuar" data-icone="play" data-tamanho-icone="20">Continuar</button>
            <button class="botao botao--contorno" type="button" id="botao-sair-pausa">Sair da partida</button>
          </div>
        </section>
      </div>

      <p class="jogo__dica" id="dica-teclado">
        <span><kbd>1</kbd> a <kbd>4</kbd> ou <kbd>A</kbd> a <kbd>D</kbd> respondem</span>
        <span><kbd>Enter</kbd> continua</span>
        <span><kbd>P</kbd> pausa</span>
        <span><kbd>Esc</kbd> sai</span>
      </p>
    </section>

    <!-- Sem partida -->
    <section id="sem-partida" hidden></section>

    <!-- Avisos para leitores de tela (pausa, retomada) -->
    <p class="sr-only" id="aviso-jogo" role="status" aria-live="polite"></p>
  </main>

  <footer class="rodape" id="rodape"></footer>

  <noscript>
    <p style="padding:1rem;text-align:center">O Quizio precisa de JavaScript ativado para funcionar.</p>
  </noscript>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
