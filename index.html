<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Quizio: quizzes de conhecimentos gerais com 12 temas, explicação em cada resposta, níveis, missões e conquistas.">
  <meta name="theme-color" content="#FFF8EF">
  <title>Quizio | Responda, erre, aprenda, repita</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='2' y='2' width='36' height='36' rx='12' fill='%237254D8' stroke='%2335254F' stroke-width='2.5'/%3E%3Ccircle cx='20' cy='19' r='9' fill='%23FFD166' stroke='%2335254F' stroke-width='2.5'/%3E%3Cpath d='M16.8 16.6a3.3 3.3 0 1 1 4.7 3c-1 .5-1.5 1.1-1.5 2.1' fill='none' stroke='%2335254F' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='24.4' r='1.3' fill='%2335254F'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- As fontes são carregadas pelo @import dentro de css/variables.css -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/home.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Marca a página como "com JavaScript" antes da primeira pintura (evita piscar) -->
  <script>document.documentElement.classList.add("js");</script>
</head>

<!-- data-base: caminho até a raiz do projeto ("" aqui, "../" nas páginas dentro de pages/) -->
<body data-pagina="home" data-base="">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="cabecalho" id="cabecalho"></header>

  <main id="conteudo">
    <section class="abertura" id="abertura" aria-label="Apresentação"></section>

    <!-- Faixa decorativa: os temas estão listados com detalhes mais abaixo -->
    <div class="faixa" id="faixa-temas" aria-hidden="true"></div>

    <section class="painel fundo-escuro" id="painel" aria-label="Seu painel"></section>
    <section class="secao" id="categorias" aria-labelledby="categorias-titulo"></section>
    <section class="secao secao--papel" id="modos" aria-labelledby="modos-titulo"></section>
    <section class="secao" id="recompensas" aria-labelledby="recompensas-titulo"></section>
    <section class="secao secao--papel" id="historia" aria-labelledby="historia-titulo" hidden></section>
    <section class="chamada fundo-escuro" id="chamada-final" aria-label="Comece a jogar"></section>
  </main>

  <footer class="rodape" id="rodape"></footer>

  <noscript>
    <p style="padding:1rem;text-align:center">O Quizio precisa de JavaScript ativado para funcionar.</p>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
