<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resultado | Quizio</title>
  <meta name="description" content="Veja o seu desempenho, o XP conquistado e revise as respostas da partida.">
  <meta name="theme-color" content="#7254D8">

  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/gamificacao.css">
  <link rel="stylesheet" href="../css/revisao.css">
  <link rel="stylesheet" href="../css/pages/resultado.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>

<body data-pagina="resultado" data-base="../">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="cabecalho" id="cabecalho"></header>

  <main class="container pagina resultado-pagina" id="conteudo">
    <div class="resultado" id="resultado" hidden>
      <section class="card resultado__hero" id="resultado-hero" aria-labelledby="resultado-titulo"></section>

      <!-- Só no duelo local -->
      <section id="resultado-duelo" aria-labelledby="duelo-titulo" hidden></section>

      <section class="resultado__grade" id="resultado-dados" aria-label="Resumo da partida"></section>
      <div class="resultado__colunas" id="resultado-progresso"></div>
      <div id="resultado-conquistas"></div>
      <p class="campo__erro" id="erro-resultado" role="alert"></p>
      <div class="resultado__acoes" id="resultado-acoes"></div>

      <!-- Revisão de respostas (abre pelo botão "Revisar respostas") -->
      <section class="revisao-secao" id="resultado-revisao" aria-labelledby="revisao-titulo" hidden></section>
    </div>

    <section id="sem-resultado" hidden></section>
  </main>

  <footer class="rodape" id="rodape"></footer>

  <noscript>
    <p style="padding:1rem;text-align:center">O Quizio precisa de JavaScript ativado para funcionar.</p>
  </noscript>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
