<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil | Quizio</title>
  <meta name="description" content="Seu perfil no Quizio: nível, sequência de dias, estatísticas, conquistas e histórico de partidas.">
  <meta name="theme-color" content="#7254D8">

  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/gamificacao.css">
  <link rel="stylesheet" href="../css/pages/perfil.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>

<body data-pagina="perfil" data-base="../">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="cabecalho" id="cabecalho"></header>

  <main class="container pagina" id="conteudo">
    <section class="card perfil__cabecalho" id="perfil-cabecalho" aria-labelledby="perfil-nome"></section>

    <div id="perfil-avisos"></div>
    <div id="perfil-sugestao"></div>

    <section aria-labelledby="estatisticas-titulo">
      <div class="secao__cabecalho">
        <h2 class="secao__titulo" id="estatisticas-titulo">Estatísticas</h2>
      </div>
      <div class="grade-dados" id="perfil-estatisticas"></div>
    </section>

    <div class="perfil__colunas">
      <section class="card" aria-labelledby="sequencia-titulo">
        <h2 class="card__titulo" id="sequencia-titulo" style="margin-bottom:1rem">Sequência de dias</h2>
        <div id="perfil-sequencia"></div>
      </section>

      <section class="card" aria-labelledby="modos-titulo">
        <h2 class="card__titulo" id="modos-titulo" style="margin-bottom:1rem">Por modo de jogo</h2>
        <div id="perfil-modos"></div>
      </section>
    </div>

    <div class="perfil__colunas">
      <section class="card" aria-labelledby="editar-titulo">
        <h2 class="card__titulo" id="editar-titulo">Editar perfil</h2>
        <form class="perfil__form" id="form-perfil" novalidate>
          <div>
            <label class="campo__rotulo" for="campo-nome">Nome</label>
            <input class="campo__input" id="campo-nome" name="nome" type="text" maxlength="20" minlength="2" autocomplete="nickname" aria-describedby="mensagem-perfil">
            <p class="campo__ajuda">De 2 a 20 caracteres.</p>
          </div>

          <fieldset class="perfil__grupo">
            <legend class="campo__rotulo">Avatar</legend>
            <div class="opcoes-avatar" id="opcoes-avatar"></div>
          </fieldset>

          <p class="mensagem-perfil" id="mensagem-perfil" role="status"></p>
          <button class="botao botao--primario" type="submit">Salvar alterações</button>
        </form>
      </section>

      <section class="card" aria-labelledby="categorias-titulo">
        <h2 class="card__titulo" id="categorias-titulo" style="margin-bottom:1rem">Categorias mais jogadas</h2>
        <div id="perfil-categorias"></div>
      </section>
    </div>

    <div class="perfil__colunas">
      <section class="card" aria-labelledby="conquistas-titulo">
        <div class="card__cabecalho card__cabecalho--espacado">
          <h2 class="card__titulo" id="conquistas-titulo">Conquistas desbloqueadas</h2>
          <a class="link-acao" href="conquistas.html">Ver todas</a>
        </div>
        <div id="perfil-conquistas"></div>
      </section>

      <section class="card" aria-labelledby="historico-titulo">
        <h2 class="card__titulo" id="historico-titulo" style="margin-bottom:1rem">Histórico recente</h2>
        <div id="perfil-historico"></div>
      </section>
    </div>

    <section class="card zona-dados" aria-labelledby="dados-titulo">
      <div>
        <h2 class="card__titulo" id="dados-titulo">Seus dados</h2>
        <p class="texto-suave texto-pequeno">O progresso fica salvo apenas neste navegador e não é sincronizado entre dispositivos.</p>
      </div>
      <button class="botao botao--perigo" type="button" id="botao-redefinir">Redefinir progresso</button>
    </section>
  </main>

  <footer class="rodape" id="rodape"></footer>

  <noscript>
    <p style="padding:1rem;text-align:center">O Quizio precisa de JavaScript ativado para funcionar.</p>
  </noscript>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
